[project]
name = "voicedub-studio"
version = "0.5.0"
description = "AI 配音工作台：声音设计 + 音色克隆 + 多角色对白 + 视频配音（时长对齐）+ 有声书"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["tts", "dubbing", "audiobook", "fastapi", "ffmpeg", "audio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "numpy>=1.26,<3.0",
    "pillow>=10.0,<13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", "web", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: FastAPI 的 Depends()/Query() 写在默认参数里是官方用法
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
