name: voicedub

services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: voicedub-studio:0.5.0
    container_name: voicedub-studio
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      VOICEDUB_DATA_DIR: /app/data
      DATABASE_URL: sqlite:////app/data/studio.db
      VOICEDUB_MAX_WORKERS: "1"
      # 允许浏览器直接调用时填具体域名，例如 https://console.example.com
      CORS_ORIGINS: "*"
    volumes:
      - studio-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  studio-data:
